<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
    model-viewer {
        width: 75%;
        height: 75%;
    }
    ar-button {
        width: 10%;
        height: 10%;
    }
</style>
<body background="../images/archpicture.png" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0" onload="this.focus()">
    <model-viewer src="arch.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1">
        <div class="progress-bar" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
        <button slot="ar-button" id="ar-button">
            View in your space! 
        </button>
    </model-viewer>
</body>
